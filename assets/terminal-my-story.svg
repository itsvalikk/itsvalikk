<svg xmlns="http://www.w3.org/2000/svg" width="780" height="541" viewBox="0 0 780 541" role="img" aria-labelledby="title desc">
  <title id="title">cat story.txt — FROM THE GARAGE</title>
  <desc id="desc">I'm a mechanic and entrepreneur. I run an automotive workshop and build software alongside that work. AI opened a new door. At Mindforge, I learn by turning ideas into apps with Claude and Codex, then testing and improving them. PitStop Garage MK comes from my day job; other projects reach beyond the garage. I set the product direction. The decisions and responsibility stay with me.</desc>
