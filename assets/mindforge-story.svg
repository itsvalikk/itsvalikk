  <path d="M1 49h778" stroke="#303b2b"/>
  <text x="28" y="32" font-size="18" fill="#b9d997">&gt; whoami</text>
  <text x="752" y="31" text-anchor="end" font-size="12" letter-spacing="1.3" fill="#a8b49b">VALI / HUMAN IN THE LOOP</text>
  <ellipse cx="390" cy="190" rx="365" ry="145" fill="url(#story-glow)"/>
  <path d="M23 80v183" stroke="#87a66e" stroke-opacity=".22" stroke-width="2"/>
  <!-- A fixed character advance keeps each clip and cursor in exact agreement. -->
  <text id="story-line-1" class="story-line" x="40" y="100" textLength="554.4" lengthAdjust="spacingAndGlyphs" clip-path="url(#story-clip-1)">I'm Vali. Mechanic. Entrepreneur.</text>
  <text id="story-line-2" class="story-line" x="40" y="140" textLength="571.2" lengthAdjust="spacingAndGlyphs" clip-path="url(#story-clip-2)">I run a workshop. I build with AI.</text>
  <text id="story-line-3" class="story-line" x="40" y="180" textLength="554.4" lengthAdjust="spacingAndGlyphs" clip-path="url(#story-clip-3)">Claude + Codex help me turn ideas</text>
  <text id="story-line-4" class="story-line" x="40" y="220" textLength="621.6" lengthAdjust="spacingAndGlyphs" clip-path="url(#story-clip-4)">into apps. I steer. I test. I decide.</text>
  <text id="story-line-5" class="story-line" x="40" y="260" textLength="487.2" lengthAdjust="spacingAndGlyphs" clip-path="url(#story-clip-5)">From the garage to Mindforge.</text>
  <g aria-hidden="true">
    <g id="story-caret-1" class="story-caret"><g id="caret-track-1"><rect class="caret-blink" x="42" y="80" width="11" height="24"/></g></g>
    <g id="story-caret-2" class="story-caret"><g id="caret-track-2"><rect class="caret-blink" x="42" y="120" width="11" height="24"/></g></g>
    <g id="story-caret-3" class="story-caret"><g id="caret-track-3"><rect class="caret-blink" x="42" y="160" width="11" height="24"/></g></g>
    <g id="story-caret-4" class="story-caret"><g id="caret-track-4"><rect class="caret-blink" x="42" y="200" width="11" height="24"/></g></g>
    <g id="story-caret-5" class="story-caret"><g id="caret-track-5"><rect class="caret-blink" x="42" y="240" width="11" height="24"/></g></g>
  </g>
  <path d="M28 285h724" stroke="#2b3528"/>
  <text x="28" y="309" font-size="12" letter-spacing=".8" fill="#91a47d">mindforgewr</text>
  <text x="752" y="309" text-anchor="end" font-size="12" fill="#a9b39f">human-led <tspan fill="#65745b">/</tspan> AI-assisted</text>
</svg>
