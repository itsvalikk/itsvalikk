  <title id="title">cat process.txt — HOW I WORK</title>
  <desc id="desc">01 / THE PROBLEM: Start with a real problem and a clear idea of who it helps. 02 / THE FIRST VERSION: Shape the smallest useful version. 03 / BUILD AND VERIFY: Build with AI, inspect the result and test what actually works. 04 / THE NEXT ITERATION: Use feedback to decide what to improve next. TOOLKIT: My projects use a mix of TypeScript, React Native, Next.js, Electron, Supabase and Cloudflare, with Claude Code and Codex as building partners.</desc>
