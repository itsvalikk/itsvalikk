  <title id="title">open Trainic — ACTIVE DEVELOPMENT</title>
  <desc id="desc">a healthier daily routine Training and nutrition in Romanian, bringing workouts, food tracking and daily habits into one application. FOR: People who want to train and build healthier routines in Romanian. INSIDE: Workouts, nutrition, habits and an AI coach informed by calculated data. BUILT WITH: Expo, React Native, TypeScript and Supabase; iOS and web.</desc>
