<svg xmlns="http://www.w3.org/2000/svg" width="780" height="384" viewBox="0 0 780 384" role="img" aria-labelledby="title desc">
  <title id="title">open Atlas — DESKTOP APP</title>
  <desc id="desc">A local AI workspace on Windows: providers, online and local models, project tools and web search in one application. BUILT WITH: Electron and JavaScript. Public distribution is not announced here.</desc>
  <style>
    text { font-family: Consolas, 'Liberation Mono', monospace; }
    .line { font-size: 28px; fill: #eceee5; animation: reveal .3s ease-out both; }
    .label { font-size: 21px; letter-spacing: 1px; fill: #b9d99a; }
    @keyframes reveal { from { fill: #c0dfa2; } to { fill: #eceee5; } }
    @media (prefers-reduced-motion: reduce) { .line { animation: none; } }
  </style>
  <rect width="780" height="384" rx="12" fill="#050505"/>
  <rect x="1" y="1" width="778" height="382" rx="11" fill="none" stroke="#283026"/>
  <path d="M1 52h778" stroke="#283026"/>
  <text x="28" y="34" fill="#c0dfa2" font-size="22">&gt; open Atlas</text>
  <text x="750" y="33" text-anchor="end" fill="#8f9c84" font-size="12" letter-spacing=".7">DESKTOP APP</text>
  <text x="34" y="91" class="line" textLength="537.6" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.000s">A local AI workspace on Windows:</text>
  <text x="34" y="127" class="line" textLength="588" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.025s">providers, online and local models,</text>
  <text x="34" y="163" class="line" textLength="588" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.050s">project tools and web search in one</text>
  <text x="34" y="199" class="line" textLength="201.6" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.075s">application.</text>
  <text x="34" y="247" class="label">BUILT WITH</text>
  <text x="34" y="282" class="line" textLength="520.8" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.100s">Electron and JavaScript. Public</text>
  <text x="34" y="318" class="line" textLength="588" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.125s">distribution is not announced here.</text>
