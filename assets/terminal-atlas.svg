  <text x="750" y="33" text-anchor="end" fill="#8f9c84" font-size="12" letter-spacing=".7">DESKTOP APP</text>
  <text x="34" y="91" class="line" textLength="436.8" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.000s">an AI workspace on Windows</text>
  <text x="34" y="150" class="line" textLength="705.6" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.025s">A local desktop application that brings AI</text>
  <text x="34" y="188" class="line" textLength="672" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.050s">providers, models and project tools into</text>
  <text x="34" y="226" class="line" textLength="235.2" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.075s">one workspace.</text>
  <text x="34" y="285" class="label">FOR</text>
  <text x="34" y="320" class="line" textLength="672" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.100s">Working with different AI models without</text>
  <text x="34" y="358" class="line" textLength="571.2" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.125s">constantly switching applications.</text>
  <text x="34" y="417" class="label">INSIDE</text>
  <text x="34" y="452" class="line" textLength="655.2" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.150s">Online and local model support, project</text>
  <text x="34" y="490" class="line" textLength="352.8" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.175s">tools and web search.</text>
  <text x="34" y="549" class="label">BUILT WITH</text>
  <text x="34" y="584" class="line" textLength="520.8" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.200s">Electron and JavaScript. Public</text>
  <text x="34" y="622" class="line" textLength="588" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.225s">distribution is not announced here.</text>
