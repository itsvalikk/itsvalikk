<svg xmlns="http://www.w3.org/2000/svg" width="780" height="699" viewBox="0 0 780 699" role="img" aria-labelledby="title desc">
  <title id="title">open Atlas — DESKTOP APP</title>
  <desc id="desc">an AI workspace on Windows A local desktop application that brings AI providers, models and project tools into one workspace. FOR: Working with different AI models without constantly switching applications. INSIDE: Online and local model support, project tools and web search. BUILT WITH: Electron and JavaScript. Public distribution is not announced here.</desc>
  <style>
    text { font-family: Consolas, 'Liberation Mono', monospace; }
    .line { font-size: 28px; fill: #eceee5; animation: reveal .3s ease-out both; }
    .label { font-size: 21px; letter-spacing: 1px; fill: #b9d99a; }
    @keyframes reveal { from { fill: #c0dfa2; } to { fill: #eceee5; } }
    @media (prefers-reduced-motion: reduce) { .line { animation: none; } }
  </style>
  <rect width="780" height="699" rx="12" fill="#050505"/>
  <rect x="1" y="1" width="778" height="697" rx="11" fill="none" stroke="#283026"/>
