  <desc id="desc">research before risk A workspace for researching trading strategies, evaluating risk and testing ideas through simulations before considering real-world use. FOR: Structured research, comparison and testing — not promises of returns. INSIDE: Strategy research, evaluation and a personal trading dashboard. BUILT WITH: Next.js, TypeScript, Drizzle and SQLite.</desc>
