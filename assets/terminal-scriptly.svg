  <text x="34" y="528" class="line" textLength="520.8" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.200s">with an administration console.</text>
  <text x="34" y="587" class="label">BUILT WITH</text>
  <text x="34" y="622" class="line" textLength="672" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.225s">Next.js, React, TypeScript and Supabase.</text>
