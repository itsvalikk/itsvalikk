<svg xmlns="http://www.w3.org/2000/svg" width="780" height="775" viewBox="0 0 780 775" role="img" aria-labelledby="title desc">
  <title id="title">open Scriptly — CREATOR TOOLS</title>
  <desc id="desc">from idea to camera Helps creators who appear on camera turn an idea or a reference clip into a script and an editing plan for TikTok, Reels and Shorts. FOR: Creators planning what to say, shoot and edit. INSIDE: Written scripts and production planning, with an administration console. BUILT WITH: Next.js, React, TypeScript and Supabase. It plans content; it does not render finished videos.</desc>
  <style>
    text { font-family: Consolas, 'Liberation Mono', monospace; }
    .line { font-size: 28px; fill: #eceee5; animation: reveal .3s ease-out both; }
    .label { font-size: 21px; letter-spacing: 1px; fill: #b9d99a; }
    @keyframes reveal { from { fill: #c0dfa2; } to { fill: #eceee5; } }
    @media (prefers-reduced-motion: reduce) { .line { animation: none; } }
  </style>
  <rect width="780" height="775" rx="12" fill="#050505"/>
