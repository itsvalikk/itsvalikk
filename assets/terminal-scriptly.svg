<svg xmlns="http://www.w3.org/2000/svg" width="780" height="432" viewBox="0 0 780 432" role="img" aria-labelledby="title desc">
  <title id="title">open Scriptly — CREATOR TOOLS</title>
  <desc id="desc">For on-camera creators: turn an idea or reference clip into scripts and editing plans for TikTok, Reels and Shorts. Production planning and an administration console. It does not render finished videos. BUILT WITH: Next.js, React, TypeScript and Supabase.</desc>
