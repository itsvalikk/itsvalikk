  <text x="34" y="226" class="line" textLength="688.8" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.075s">and an editing plan for TikTok, Reels and</text>
  <text x="34" y="264" class="line" textLength="117.6" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.100s">Shorts.</text>
  <text x="34" y="323" class="label">FOR</text>
  <text x="34" y="358" class="line" textLength="672" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.125s">Creators planning what to say, shoot and</text>
  <text x="34" y="396" class="line" textLength="84" lengthAdjust="spacingAndGlyphs" style="animation-delay:0.150s">edit.</text>
