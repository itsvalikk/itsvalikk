<svg xmlns="http://www.w3.org/2000/svg" width="780" height="737" viewBox="0 0 780 737" role="img" aria-labelledby="title desc">
  <title id="title">open WeddingFlow — COLLABORATION</title>
  <desc id="desc">planning the big day A wedding-planning platform built in collaboration with Filip, with separate spaces for couples, suppliers and administrators. FOR: Bringing wedding planning and supplier coordination into one place. INSIDE: Role-based spaces and German, English and Romanian language support. BUILT WITH: React, TypeScript, Vite and Supabase. A shared project, not a solo creation.</desc>
